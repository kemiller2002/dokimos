name: CI

# Dokimos dogfoods Dokimos: after the product builds, the job result is the
# Dokimos policy evaluation of this revision against the accepted baseline in
# the durable evidence store (branch `dokimos-evidence`). The gate runs the
# same reusable action consumers use (actions/quality-gate), pointed at the
# CLI built from this revision instead of a released package.

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      accept-baseline:
        description: Accept this run's snapshot as the Dokimos baseline (main only).
        type: boolean
        default: false
      baseline-reason:
        description: Why this snapshot is accepted as the baseline.
        type: string
        default: ''

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  debounce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: dokimos-ci-debounce-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Wait for commit batch
        if: github.event_name != 'workflow_dispatch'
        run: sleep 600

  action-install:
    # The reusable action must install the pinned Dokimos even when the
    # consumer's NuGet.config declares package source mapping (as Conditor's
    # release-asset feed does); SDK 10.0.4xx refuses --add-source there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install with package source mapping in the consumer workspace
        env:
          DOKIMOS_VERSION: "0.2.0"
        run: tests/actions/install-with-source-mapping.sh

  build-test-gate:
    needs: debounce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Dokimos.sln
      - name: Build (log captured as evidence)
        id: build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/dokimos
          dotnet build Dokimos.sln --configuration Release --no-restore 2>&1 | tee artifacts/dokimos/build.log
      - name: "Repository identity conformance (issue #17)"
        # ros.json must identify this repository; a copied identity exits 4.
        run: dotnet src/Dokimos.Cli/bin/Release/net8.0/Dokimos.Cli.dll identity --root . --expected dokimos
      - name: Test (TRX captured as evidence)
        id: test
        # A red test run is judged by the Dokimos gate below (tests.failed is
        # ratcheted at zero and required evidence), not skipped: the gate
        # fails the job with exit 4, or 3 when no TRX evidence was produced.
        continue-on-error: true
        run: dotnet test Dokimos.sln --configuration Release --no-build --logger trx --results-directory artifacts/dokimos/test-results
      - name: Validate installation from the produced package
        shell: bash
        env:
          SOURCE_REVISION_ID: ${{ github.sha }}
        run: scripts/validate-package.sh artifacts/package | tee artifacts/dokimos/package-validation.json
      - name: Dokimos quality gate
        id: gate
        uses: ./actions/quality-gate
        with:
          dokimos-command: dotnet ${{ github.workspace }}/src/Dokimos.Cli/bin/Release/net8.0/Dokimos.Cli.dll
          source: src
          policy: config/dokimos-policy.json
          build-log: artifacts/dokimos/build.log
          test-results: artifacts/dokimos/test-results
          initial-baseline: baselines/accepted-snapshot.json
          persist: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && 'true' || 'auto' }}
          accept-baseline: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.accept-baseline) && 'true' || 'false' }}
          baseline-reason: ${{ inputs.baseline-reason }}
      - name: "Dokimos change-quality ratchet (self-application, #16)"
        # Judges this revision against quality/baseline.json with the exceptions
        # in quality/exceptions.json. Exit 4 regression, 6 invalid or expired
        # exception, 3 unavailable; none of them passes.
        if: always() && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          dotnet src/Dokimos.Cli/bin/Release/net8.0/Dokimos.Cli.dll ratchet check \
            --build-log artifacts/dokimos/build.log --json | tee artifacts/dokimos/ratchet.json
      - name: Ratchet baseline may only tighten
        if: always() && steps.build.outcome == 'success' && github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && git cat-file -e "$BASE_SHA:quality/baseline.json" 2>/dev/null; then
            git show "$BASE_SHA:quality/baseline.json" > "$RUNNER_TEMP/base-baseline.json"
            dotnet src/Dokimos.Cli/bin/Release/net8.0/Dokimos.Cli.dll ratchet baseline diff \
              --from "$RUNNER_TEMP/base-baseline.json" --to quality/baseline.json
          else
            echo "No accepted ratchet baseline at the base revision; first adoption."
          fi
      - name: Upload the ratchet report
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: dokimos-ratchet-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/dokimos/ratchet.json
          if-no-files-found: warn
      - name: Set up Node for the results UI
        if: always() && steps.gate.outputs.snapshot-id != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Render the results UI from this run's evidence (DOK-OPS-018/019)
        if: always() && steps.gate.outputs.snapshot-id != ''
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          dotnet src/Dokimos.Cli/bin/Release/net8.0/Dokimos.Cli.dll results \
            --baseline artifacts/dokimos/baseline.json --current artifacts/dokimos/snapshot.json \
            --policy config/dokimos-policy.json --store "$RUNNER_TEMP/dokimos-evidence-store" > artifacts/dokimos/results.json
          node results-ui/render.mjs artifacts/dokimos/results.json artifacts/results-ui
          node results-ui/report.mjs artifacts/dokimos/results.json artifacts/results-ui
      - name: Upload the results UI
        if: always() && steps.gate.outputs.snapshot-id != ''
        uses: actions/upload-artifact@v4
        with:
          name: dokimos-results-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/results-ui
          if-no-files-found: warn
      - name: Report test step outcome
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.test.outcome }}
          DISPOSITION: ${{ steps.gate.outputs.disposition }}
          GATE_EXIT: ${{ steps.gate.outputs.exit-code }}
        run: |
          echo "dotnet test step outcome: $TEST_OUTCOME; Dokimos disposition: $DISPOSITION (exit $GATE_EXIT)"
