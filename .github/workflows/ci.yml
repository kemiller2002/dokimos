name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Dokimos.sln
      - name: Build
        run: dotnet build Dokimos.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Dokimos.sln --configuration Release --no-build
