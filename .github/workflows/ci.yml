name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Dokimos.sln
      - name: Build
        run: dotnet build Dokimos.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Dokimos.sln --configuration Release --no-build
      - name: Self-measure F# sources
        if: always()
        shell: bash
        # Explicit measurement-actor declaration (R14.4): this job is CI automation.
        # The measured code's author is never inferred from it.
        env:
          ROS_ACTOR_KIND: automation
          ROS_ACTOR: github/github-actions
          ROS_TELEMETRY_PROVIDER: github
          ROS_TELEMETRY_RUNTIME: github-actions
        run: |
          mkdir -p artifacts/dokimos/self-measure
          if dotnet build Dokimos.sln --configuration Release --no-restore; then
            while IFS= read -r file; do
              safe=$(printf '%s' "$file" | tr '/.' '__')
              dotnet run --project src/Dokimos.Cli/Dokimos.Cli.fsproj --configuration Release --no-build -- measure "$file" --run-id "ci-${{ github.run_id }}-${{ github.run_attempt }}" --derived-from "git:commit/${{ github.sha }}" > "artifacts/dokimos/self-measure/$safe.json"
            done < <(find src -type f -name '*.fs' | sort)
          else
            printf '{"state":"unavailable","reason":"build-failed"}\n' > artifacts/dokimos/self-measure/unavailable.json
          fi
      - name: Capture Git temporal evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/dokimos
          git log --numstat --find-renames --format='commit %H %aI' -- src > artifacts/dokimos/git-history.txt
      - name: Upload Dokimos evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dokimos-evidence-${{ github.sha }}
          path: artifacts/dokimos
