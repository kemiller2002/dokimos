name: CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Dokimos.sln
      - name: Build
        run: dotnet build Dokimos.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Dokimos.sln --configuration Release --no-build
      - name: Self-measure F# sources
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/dokimos/self-measure
          if dotnet build Dokimos.sln --configuration Release --no-restore; then
            while IFS= read -r file; do
              safe=$(printf '%s' "$file" | tr '/.' '__')
              dotnet run --project src/Dokimos.Cli/Dokimos.Cli.fsproj --configuration Release --no-build -- measure "$file" > "artifacts/dokimos/self-measure/$safe.json"
            done < <(find src -type f -name '*.fs' -not -path '*/obj/*' -not -path '*/bin/*' | sort)
          else
            printf '{"state":"unavailable","reason":"build-failed"}\n' > artifacts/dokimos/self-measure/unavailable.json
          fi
      - name: Capture Git temporal evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/dokimos
          git log --numstat --find-renames --format='commit %H %aI' -- src > artifacts/dokimos/git-history.txt
      - name: Analyze repository with temporal evidence
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/dokimos/git-history.txt ] && dotnet build Dokimos.sln --configuration Release --no-restore; then
            dotnet run --project src/Dokimos.Cli/Dokimos.Cli.fsproj --configuration Release --no-build -- analyze src --git-history artifacts/dokimos/git-history.txt > artifacts/dokimos/repository-analysis.json
          else
            printf '{"state":"unavailable","reason":"analysis-prerequisite-failed"}\n' > artifacts/dokimos/repository-analysis.json
          fi
      - name: Generate canonical Dokimos snapshot
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/dokimos/git-history.txt ] && dotnet build Dokimos.sln --configuration Release --no-restore; then
            dotnet run --project src/Dokimos.Cli/Dokimos.Cli.fsproj --configuration Release --no-build -- snapshot src --git-history artifacts/dokimos/git-history.txt --repository "$GITHUB_REPOSITORY" --revision "$GITHUB_SHA" --ref "$GITHUB_REF_NAME" > artifacts/dokimos/snapshot.json
          else
            printf '{"state":"unavailable","reason":"snapshot-prerequisite-failed"}\n' > artifacts/dokimos/snapshot.json
          fi
      - name: Compare with accepted Dokimos snapshot
        if: always()
        shell: bash
        run: |
          if [ -f baselines/accepted-snapshot.json ] && [ -f artifacts/dokimos/snapshot.json ] && dotnet build Dokimos.sln --configuration Release --no-restore; then
            dotnet run --project src/Dokimos.Cli/Dokimos.Cli.fsproj --configuration Release --no-build -- compare baselines/accepted-snapshot.json artifacts/dokimos/snapshot.json > artifacts/dokimos/comparison.json
          else
            printf '{"state":"unavailable","reason":"accepted-baseline-or-current-snapshot-unavailable"}\n' > artifacts/dokimos/comparison.json
          fi
      - name: Promote authorized canonical baseline
        if: success()
        shell: bash
        run: |
          if [ -f .dokimos/accept-next-baseline ] && [ -f artifacts/dokimos/snapshot.json ]; then
            mkdir -p baselines
            cp artifacts/dokimos/snapshot.json baselines/accepted-snapshot.json
            rm .dokimos/accept-next-baseline
            git config user.name "dokimos-ci"
            git config user.email "dokimos-ci@users.noreply.github.com"
            git add baselines/accepted-snapshot.json .dokimos/accept-next-baseline
            git commit -m "Accept canonical Dokimos longitudinal baseline"
            git push
          fi
      - name: Upload Dokimos evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dokimos-evidence-${{ github.sha }}
          path: artifacts/dokimos
