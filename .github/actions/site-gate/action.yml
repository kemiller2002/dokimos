name: Dokimos site quality gate
description: >-
  The complete website quality gate shared by pull-request validation and
  production deployment: Praxis governance, Visual Engineering verification,
  site tests, a clean dist/ build, and a browser accessibility audit.
  Communication Engineering has no published verification CLI yet
  (see docs/website/SITE.md); add it here when one exists.

runs:
  using: composite
  steps:
    - name: Install pinned site toolchain
      shell: bash
      run: npm ci

    - name: Praxis registry and repository validation
      shell: bash
      # ./praxis is a POSIX sh launcher for the pinned native Praxis release.
      run: |
        ./praxis registry check
        ./praxis validate

    - name: Visual Engineering verification
      shell: bash
      run: |
        # init re-derives the committed research context from the pinned
        # package (package.json). It must not change any tracked file; if it
        # does, the committed installation is stale or the package pin and
        # .echelon/visual-engineering.json disagree, and the gate fails.
        npx visual-engineering init
        git diff --exit-code
        npx visual-engineering verify --strict

    - name: Site tests (data schema, links, metadata, contrast, determinism)
      shell: bash
      run: npm test

    - name: Build dist/ from a clean tree
      shell: bash
      run: |
        test ! -e dist || { echo "dist/ must not exist in a clean checkout"; exit 1; }
        npm run build
        test -f dist/CNAME && test -f dist/index.html

    - name: Browser accessibility and responsive audit
      shell: bash
      run: |
        npx playwright install --with-deps chromium
        npm run audit

    - name: Results UI render and browser audit (DOK-OPS-019)
      shell: bash
      run: |
        # Renders committed dokimos.results fixtures produced by the real CLI
        # and audits them: axe WCAG 2.1 AA, 320-1920px, 200% text, forced colors.
        for fixture in results-ui/test/fixtures/*-results.json; do
          out="$RUNNER_TEMP/results-ui/$(basename "$fixture" .json)"
          npm run results:render -- "$fixture" "$out"
          npm run results:audit -- "$out"
          # Folio printable report from the same contract, exported with Chromium.
          npm run results:report -- "$fixture" "$out"
          npm run results:pdf -- "$out"
        done
